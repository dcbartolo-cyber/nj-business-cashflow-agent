name: Thursday Family Skills Games Concierge

on:
  schedule:
    # Runs at 11:00 UTC (7:00 AM EST) every Thursday morning
    - cron: '0 11 * * 4'
  workflow_dispatch: # Allows manual trigger anytime

jobs:
  run-skills-games:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          pip install requests google-genai

      - name: Execute Skills Games Concierge
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python family_skills_games.py
