name: Weekly Weekend Planner Agent

on:
  schedule:
    # Runs at 12:00 UTC (7:00 AM EST) every Wednesday
    - cron: '0 12 * * 3'
  workflow_dispatch: # Allows manual run anytime

jobs:
  run-weekend-planner:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          pip install requests icalendar google-generativeai

      - name: Execute Weekend Planner Agent
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GCAL_ICS_URL: ${{ secrets.GCAL_ICS_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python agent_weekend_planner.py
